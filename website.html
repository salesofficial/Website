<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffe0c9">
  <meta name="description" content="Get started with your reward eligibility.">
  <title>Get Started</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --reward-peach: #ffe0c9;
      --reward-peach-dark: #fbc7a8;
      --reward-cream: #fff4f1;
      --reward-ink: #1e1311;
      --reward-red: #e6443d;
      --reward-muted: #7d6d6b;
      --font-display: "Poppins", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--reward-ink);
      background: var(--reward-peach);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: inherit; text-decoration: none; }

    .page {
      display: flex;
      justify-content: center;
      min-height: 100svh;
      padding: 48px 20px;
      background: linear-gradient(to bottom, var(--reward-peach), var(--reward-peach-dark));
    }
    .content { width: 100%; max-width: 448px; }

    .brand-row { display: flex; justify-content: center; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px 12px 12px;
      border-radius: 999px;
      color: var(--reward-red);
      background: var(--reward-cream);
      box-shadow: 0 10px 25px -12px rgba(0, 0, 0, .25);
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
    }
    .brand-badge {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 50%;
      color: var(--reward-cream);
      background: var(--reward-ink);
      font-size: 14px;
      font-weight: 800;
    }

    h1 { margin: 16px 0 0; text-align: center; font-weight: 800; line-height: 1; }
    .headline-main { display: block; color: var(--reward-red); font-size: 48px; letter-spacing: -.05em; }
    .headline-main sup { position: relative; top: -.58em; margin-left: 1px; font-size: 20px; line-height: 0; vertical-align: baseline; }
    .headline-sub { display: block; margin-top: 12px; color: var(--reward-ink); font-size: 24px; letter-spacing: -.045em; }

    .description {
      width: min(100%, 320px);
      margin: 20px auto 0;
      color: var(--reward-muted);
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.625;
    }

    .claiming {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 32px;
      padding: 20px 24px;
      border-radius: 24px;
      color: var(--reward-ink);
      background: var(--reward-cream);
      box-shadow: 0 12px 30px -16px rgba(0, 0, 0, .3);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.5;
      white-space: nowrap;
    }
    .status-dot { position: relative; display: inline-flex; width: 12px; height: 12px; flex: 0 0 12px; }
    .status-dot::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--reward-red);
      opacity: .75;
      animation: ping 1s cubic-bezier(0, 0, .2, 1) infinite;
    }
    .status-dot::after { content: ""; position: relative; display: block; width: 12px; height: 12px; border-radius: 50%; background: var(--reward-red); }
    .claim-number { color: var(--reward-red); }

    .choices { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
    .choice {
      display: block;
      padding: 24px;
      border-radius: 24px;
      text-align: center;
      transition: transform .15s cubic-bezier(.4, 0, .2, 1);
    }
    .choice:hover { transform: scale(1.01); }
    .choice:active { transform: scale(.99); }
    .choice:focus-visible { outline: 3px solid rgba(230, 68, 61, .35); outline-offset: 3px; }
    .choice--primary { color: var(--reward-cream); background: var(--reward-red); box-shadow: 0 16px 35px -14px rgba(220, 60, 45, .7); }
    .choice--secondary { color: var(--reward-ink); background: var(--reward-cream); box-shadow: 0 12px 30px -16px rgba(0, 0, 0, .3); }
    .choice-title { display: block; font-size: 20px; font-weight: 800; line-height: 1.25; letter-spacing: -.035em; }
    .choice-subtitle { display: block; margin-top: 4px; font-size: 16px; font-weight: 800; line-height: 1.5; }
    .choice--primary .choice-subtitle { color: rgba(255, 244, 241, .9); }
    .choice--secondary .choice-subtitle { color: var(--reward-muted); }

    @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
    @media (max-width: 480px) {
      .page { padding: 32px 20px; }
      .headline-main { font-size: 44px; }
      .headline-sub { font-size: 22px; }
    }
    @media (max-width: 360px) {
      .brand { font-size: 16px; }
      .claiming { padding-inline: 15px; font-size: 14px; }
      .headline-main { font-size: 40px; }
      .headline-sub { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="content">
      <div class="brand-row">
        <div class="brand" aria-label="SHEIN Rewards"><span class="brand-badge">S</span><span>SHEIN Rewards</span></div>
      </div>

      <h1>
        <span class="headline-main">Get $750<sup>*</sup></span>
        <span class="headline-sub">Towards shopping at SHEIN</span>
      </h1>

      <p class="description">Get up to $750 towards shopping at SHEIN - for dresses, tops, shoes &amp; accessories.</p>

      <div class="claiming" aria-label="12,863 shoppers claiming now">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="claim-number">12,863</span>
        <span>shoppers claiming now</span>
      </div>

      <section class="choices" aria-label="Reward eligibility options">
        <a class="choice choice--primary" data-confirmation-link href="#" rel="nofollow">
          <span class="choice-title">I'm 21 or older</span>
          <span class="choice-subtitle">Eligible for the full reward</span>
        </a>
        <a class="choice choice--secondary" data-confirmation-link href="#" rel="nofollow">
          <span class="choice-title">I'm under 21</span>
          <span class="choice-subtitle">Limited reward eligibility</span>
        </a>
      </section>
    </div>
  </main>

  <script>

      The provided rewards URL is set as the default destination.
    */
    const CONFIRMATION_URL = "https://rewardly-8u.vercel.app/rewards?ttclid=E_C_P_CokB1ck7tp3q8pBbT14_vyGnHsFfltnSGsLhЗВWhsQncUSzaWsЕ5гd1oJonВxaZ8CsuХrwİzEfYSu_j1xDG5krMz_9MyoUеUbpІMпkАМnpdiQghWhśłuThJQ2rdHХ8ZSІ5ASВu2ajO6СхT2hLR4EuqÖvLRhłаKQU2ClyW_85ZGZW_85ZGZ";

    document.querySelectorAll("[data-confirmation-link]").forEach((link) => {
      link.href = CONFIRMATION_URL;
    });
  </script>
</body>
</html>
